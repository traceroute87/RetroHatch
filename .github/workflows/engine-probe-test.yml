# TEMPORARY, manual only. Probes four free search APIs (documented endpoints) from a runner, <= 90 s. Read-only; delete after the test.
name: engine-probe-test
on: workflow_dispatch
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - run: python3 -I discovery/engine_probe.py --out out | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: engine-probe, path: out}
