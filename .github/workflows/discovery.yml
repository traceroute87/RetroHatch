# Weekly candidate discovery. Read-only on the repo; only opens/edits ONE issue. Never publishes or installs anything.
name: discovery
on:
  schedule:
    - cron: "23 5 * * 1"
  workflow_dispatch:
    inputs:
      lead_urls:
        description: "Optional: up to 10 GitHub/GitLab/Codeberg repository URLs (space or comma separated). Unapproved leads, reported separately."
        required: false
        default: ""
      submitted_only:
        description: "Submitted leads only"
        type: boolean
        default: false
permissions:
  contents: read
  issues: write
jobs:
  discover:
    if: ${{ !inputs.submitted_only }}   # inputs is empty on scheduled runs, so they always take this job
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      GH_TOKEN: ${{ github.token }}
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - run: python3 tests/test_discover.py
      # discovery/crawl.py is the one discovery pipeline: GitHub and forge search, README mentions, link-following, community sources, package
      # checks. Its summary.json feeds the issue below. An incomplete crawl labels itself INCOMPLETE, NOT AUTHORITATIVE in its report.
      - name: Crawl tests
        if: always()
        continue-on-error: true
        run: python3 tests/test_crawl.py
      # restore + save split so the cache is written even when an earlier step failed (the combined action saves only on success). The cache holds
      # the package lead store and tree-scan progress between runs; its key keeps the historical "freeserp-leads-" prefix so existing history is restored.
      - name: Restore package lead cache
        if: always()
        uses: actions/cache/restore@v4
        with:
          path: .cache/leads
          key: freeserp-leads-${{ github.run_id }}
          restore-keys: freeserp-leads-
      - name: Crawl discovery
        if: always()
        shell: bash   # pipefail: a crawl that exits non-zero must fail the job, not be hidden by tee
        timeout-minutes: 16
        env:
          SUBMITTED_LEADS: ${{ inputs.lead_urls }}   # via env only, never interpolated into the script; empty on scheduled runs
        run: python3 -I discovery/crawl.py --out out-crawl --max-req 1200 --deadline 780 --package-leads .cache/leads/packages.json --package-seed discovery/package-leads.json --sources discovery/sources.txt --submitted="$SUBMITTED_LEADS" | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: crawl-discovery, path: out-crawl, if-no-files-found: ignore}
      - name: Save package lead cache
        if: always() && hashFiles('.cache/leads/*.json') != ''
        uses: actions/cache/save@v4
        with:
          path: .cache/leads
          key: freeserp-leads-${{ github.run_id }}
      # The single issue is driven by the crawl's summary.json: skipped on a crawl that reported failures (rate limits, crash, failed
      # searches; a spent request budget is normal), when no autonomous OPK was verified, or when the same OPK set was already filed.
      - name: Create or update the single discovery issue
        run: |
          S=out-crawl/summary.json
          [ -s "$S" ] || { echo "::warning::no crawl summary; issue left unchanged"; exit 0; }
          field() { python3 -c "import json,sys;print(json.load(open('$S'))[sys.argv[1]])" "$1"; }
          [ "$(field errors)" = "[]" ] || { echo "::warning::crawl reported failures (API limits/errors); issue left unchanged: $(field errors)"; exit 0; }
          [ "$(field apps)" != "0" ] || { echo "no actionable candidates"; exit 0; }
          MARK="rh-discovery:rg-nano:$(field digest)"
          # same candidate set already filed (open or closed): do nothing
          if gh issue list --label discovery --state all --limit 30 --json body --jq '.[].body' | grep -qF "$MARK"; then echo "unchanged"; exit 0; fi
          { head -c 60000 out-crawl/discovery-results.md; printf '\n<!-- %s -->\n' "$MARK"; } > out-crawl/issue.md   # issue bodies are limited to 65536 characters
          gh label create discovery --color 0e8a16 --description "Automated candidate discovery" 2>/dev/null || true
          N=$(gh issue list --label discovery --state open --json number --jq '.[0].number // empty')
          if [ -n "$N" ]; then gh issue edit "$N" --body-file out-crawl/issue.md   # edit, not comment: no notification spam
          else gh issue create --label discovery --title "Discovery: rg-nano candidates" --body-file out-crawl/issue.md; fi
  # Submitted leads only: just the supplied repositories (no search, owner/page crawling or stored-URL rechecks), small
  # request budget, no caches restored or saved, no issue touched. Report in the job summary + artifact; nothing is approved or published.
  submitted:
    if: ${{ inputs.submitted_only }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - run: python3 tests/test_crawl.py
      - name: Submitted-only discovery
        shell: bash   # pipefail: no valid repository URL must fail the job, not be hidden by tee
        env:
          SUBMITTED_LEADS: ${{ inputs.lead_urls }}   # via env only, never interpolated into the script
        run: python3 -I discovery/crawl.py --submitted-only --out out-submitted --submitted="$SUBMITTED_LEADS" | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: submitted-discovery, path: out-submitted, if-no-files-found: ignore}
