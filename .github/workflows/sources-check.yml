# Validates discovery/sources.txt in pull requests. OFFLINE and read-only: the script makes no request, writes nothing, and the job has
# no secrets and only contents:read. It never crawls and never uses pull_request_target. Crawling happens only after a maintainer merges.
name: sources-check
on:
  pull_request:
    paths:
      - discovery/sources.txt
      - discovery/profiles.json
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - run: python3 -I discovery/crawl.py --check-sources
