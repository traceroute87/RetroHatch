# TEMPORARY, manual only. Probes PullPush + Wayback CDX from a runner (<= 30 requests, <= 60 s). Read-only; delete after the test.
name: web-discovery-test
on: workflow_dispatch
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - run: python3 -I discovery/web_probe.py --out out | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: web-discovery-evidence, path: out}
